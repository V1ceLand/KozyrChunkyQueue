# KozyrChunkyQueue

on-players-online: pause   # pause | throttle - действие когда онлайн сервера 1 или более
# "pause" - остановка прогрузки. Возобновляется мгновенно, как только сервер опустеет.
# "throttle" - уменьшает выделяемое кол-во потоков для прогрузки и продолжает её.
# Если вы замечали, прогрузка территории нагружает процессор вашего сервера на максимум.
# Как следствие во время прогрузки серверу не остаётся мощностей, чтобы обрабатывать игру игроков.
# Данная настройка ограничивает сколько потоков (ядер) будет выделено под этот процесс.
# В конечном итоге позволяет комфортно играть и проводить прогрузку карты одновременно.
#
# ВАЖНО: число потоков в этом режиме - настройка уровня сервера, применяется один
# раз при старте и не может переключаться "на лету" в зависимости от онлайна.
# Поэтому в режиме "throttle" прогрузка ВСЕГДА идёт с этой урезанной скоростью -
# даже когда на сервере вообще никого нет. Если нужна полная скорость на пустом
# сервере - используйте режим "pause" вместо "throttle".

throttle-worker-threads: 2 # используется только если on-players-online: throttle
# Если у вашего сервера Х ядер, установите значение на 2 меньше - это оставит
# свободными 2 ядра для обработки непосредственно самой игры.
# Настройка индивидуальна для каждого железа - проверяйте самостоятельно.

auto-start: true # активирует автоматическую прогрузку миров по цепочке слева направо
queue-order: world, world_nether, world_the_end

# Режим "Простая генерация" - полностью управляется этим конфигом, текущие настройки/состояние Chunky игнорируются.
simple-generation:
  enabled: false
  order: world, world_nether, world_the_end

  # Чтобы добавить в очередь ещё один мир (например "spawn" или любое
  # своё название) - скопируй блок ниже, вставь под ним, поменяй имя
  # ключа на нужное название мира и добавь его в order выше.
  worlds:
    world:
      radius: 15000
      center: 0 0
    world_nether:
      radius: 15000
      center: 0 0
    world_the_end:
      radius: 15000
      center: 0 0
