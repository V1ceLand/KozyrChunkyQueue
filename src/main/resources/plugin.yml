name: KozyrChunkyQueue
version: 2.0.1
main: eu.kozyr.chunkyqueue.KozyrChunkyQueuePlugin
api-version: '1.21'
author: kozyr
depend: [Chunky]
description: >
  Автоматически прогружает цепочку миров по очереди (Chunky) и ставит
  прогрузку на паузу/троттлинг, пока на сервере есть игроки.
commands:
  chunkyqueue:
    description: Управление автоматической прогрузкой миров (status/stop/resume/reload)
    usage: /chunkyqueue [status|stop|resume|reload]
permissions:
  kozyrchunkyqueue.status:
    default: op
  kozyrchunkyqueue.admin:
    default: op
